[tool.poetry]
name = "employee-management-api"
version = "0.1.0"
description = "Employee Management REST API built with FastAPI"
authors = ["Your Name"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = {extras = ["email"], version = "^2.13.5"}
pwdlib = {extras = ["argon2"], version = "^0.3.1"}
pyjwt = "^2.15.1"
pydantic-settings = "^2.15.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^9.1.1"
httpx = "^0.28.1"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore=["B008"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"